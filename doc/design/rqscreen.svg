<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Rim &amp; Ridge RQ-Ride-Screen: Navigationshinweis, Geschwindigkeit, RQ-Index, Puls, Wegzähler, Untergrund-Auswahl, Qualitäts-Regler, Aufnahme-Taste">
  <title>Rim &amp; Ridge — RQ-Ride-Screen</title>

  <circle cx="240" cy="240" r="240" fill="#161B1F"/>
  <circle cx="240" cy="240" r="234" fill="none" stroke="#3A362E" stroke-width="1.5"/>

  <!-- nav chip: same widget/icon as the mainscreen, moved up to y=30 (from y=92) — this
       screen has no status row (wifi/gps/battery), same tradeoff the Settings screen makes,
       so the freed space goes to the surface/quality controls below instead. -->
  <rect x="155" y="30" width="170" height="40" rx="20" fill="#1E252B" stroke="#CBA36B" stroke-opacity="0.35" stroke-width="1.5"/>
  <g transform="translate(183,50)" fill="none" stroke="#CBA36B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0,12 L0,-4 L-9,-4"/>
    <path d="M-9,-4 L-4,-8 M-9,-4 L-4,0"/>
  </g>
  <text x="208" y="58" font-family="'IBM Plex Mono',monospace" font-size="21" fill="#E7E2D6">180 m</text>

  <!-- speed / RQ-index: the two "mittelgroß" hero values this screen exists for, side by
       side at equal size/weight — the point of this screen is to give both the same
       priority, unlike the Mainscreen where speed dominates. -->
  <text x="150" y="140" text-anchor="middle" font-family="'Big Shoulders Display'" font-weight="700" font-size="60" fill="#F3ECDF">24.6</text>
  <text x="150" y="163" text-anchor="middle" font-family="'IBM Plex Mono'" font-size="14" letter-spacing="2" fill="#9BA097">KM/H</text>

  <!-- RQ-index: color IS the class (same 5 HF-zone tokens the mainscreen's rr_line_rq and
       heart-rate band use), same convention, bigger and with a digit since this screen's
       whole purpose is watching this value, not just glancing at a sliver of color. -->
  <text x="330" y="140" text-anchor="middle" font-family="'Big Shoulders Display'" font-weight="700" font-size="60" fill="#D7B463">3</text>
  <text x="330" y="163" text-anchor="middle" font-family="'IBM Plex Mono'" font-size="13" letter-spacing="1" fill="#9BA097">RQ-KLASSE</text>

  <!-- small stats: pulse + trip counter ("Wegzähler") -->
  <g transform="translate(150,185)">
    <path d="M0,4 C-6,-2 -10,-8 -4,-11 C-1,-12.5 0,-9.5 0,-8 C0,-9.5 1,-12.5 4,-11 C10,-8 6,-2 0,4 Z" fill="#CBA36B"/>
  </g>
  <text x="150" y="215" text-anchor="middle" font-family="'Big Shoulders Display'" font-weight="600" font-size="22" fill="#E7E2D6">138</text>

  <g transform="translate(330,184)" fill="none" stroke="#CBA36B" stroke-width="1.8" stroke-linecap="round">
    <line x1="-8" y1="0" x2="8" y2="0"/>
    <line x1="-8" y1="-3.5" x2="-8" y2="3.5"/>
    <line x1="-2.7" y1="-2.5" x2="-2.7" y2="2.5"/>
    <line x1="2.7" y1="-2.5" x2="2.7" y2="2.5"/>
    <line x1="8" y1="-3.5" x2="8" y2="3.5"/>
  </g>
  <text x="330" y="215" text-anchor="middle" font-family="'Big Shoulders Display'" font-weight="600" font-size="20" fill="#E7E2D6">3.2 km</text>

  <!-- surface picker: text-only pills, deliberately no per-surface icon — six distinct,
       legible pictograms (Asphalt/Schotter/Waldweg/Feldweg/Pflaster/Sonstiges) at the
       ~20px that would fit next to a label in a 36px-tall pill fail the icon-size lesson
       (see design system §2, "mindestens 32-34px"); the label text alone is unambiguous
       and costs less space than getting six new icons wrong at small size. -->
  <text x="240" y="234" text-anchor="middle" font-family="'IBM Plex Mono'" font-size="11" letter-spacing="3" fill="#CBA36B">UNTERGRUND</text>

  <g font-family="'IBM Plex Mono'" font-size="11" letter-spacing="0.5" text-anchor="middle">
    <rect x="82" y="240" width="100" height="36" rx="18" fill="#1E252B" stroke="#CBA36B" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="132" y="262" fill="#E7E2D6">ASPHALT</text>

    <!-- selected state, shown as the example: filled brass, dark text -->
    <rect x="190" y="240" width="100" height="36" rx="18" fill="#CBA36B"/>
    <text x="240" y="262" fill="#161B1F">SCHOTTER</text>

    <rect x="298" y="240" width="100" height="36" rx="18" fill="#1E252B" stroke="#CBA36B" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="348" y="262" fill="#E7E2D6">WALDWEG</text>

    <rect x="82" y="282" width="100" height="36" rx="18" fill="#1E252B" stroke="#CBA36B" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="132" y="304" fill="#E7E2D6">FELDWEG</text>

    <rect x="190" y="282" width="100" height="36" rx="18" fill="#1E252B" stroke="#CBA36B" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="240" y="304" fill="#E7E2D6">PFLASTER</text>

    <rect x="298" y="282" width="100" height="36" rx="18" fill="#1E252B" stroke="#CBA36B" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="348" y="304" fill="#E7E2D6">SONSTIGES</text>
  </g>

  <!-- quality: a 4-stop segmented control, not a continuous slider — "groß genug" reads
       better here as four fat (r=20, matching the icon-buttons' r=25 family) tap targets
       than as a thin continuous track that's fiddly to hit one-handed while riding. -->
  <text x="240" y="334" text-anchor="middle" font-family="'IBM Plex Mono'" font-size="11" letter-spacing="3" fill="#CBA36B">QUALITÄT</text>

  <line x1="150" y1="360" x2="330" y2="360" stroke="#CBA36B" stroke-opacity="0.25" stroke-width="3"/>
  <g font-family="'Big Shoulders Display'" font-weight="700" font-size="18" text-anchor="middle">
    <circle cx="150" cy="360" r="20" fill="#1E252B" stroke="#CBA36B" stroke-width="2"/>
    <text x="150" y="366" fill="#E7E2D6">1</text>

    <circle cx="210" cy="360" r="20" fill="#1E252B" stroke="#CBA36B" stroke-width="2"/>
    <text x="210" y="366" fill="#E7E2D6">2</text>

    <!-- selected state, shown as the example -->
    <circle cx="270" cy="360" r="20" fill="#CBA36B"/>
    <text x="270" y="366" fill="#161B1F">3</text>

    <circle cx="330" cy="360" r="20" fill="#1E252B" stroke="#CBA36B" stroke-width="2"/>
    <text x="330" y="366" fill="#E7E2D6">4</text>
  </g>

  <!-- start/stop detail recording: idle state shown (ring + red dot, camera/record
       language) — centered on the pole (x=240), so per §3's pole exception the true
       physical circle (r=234 bezel), not the r_safe=205 formula, is what actually bounds
       it (bottom edge 446 vs. the boundary ~472 at this width, comfortable margin). The
       "recording" alt state (filled red circle + parchment stop-square, thicker red ring)
       isn't drawn here, same as the Fahrzustand-icon's four states aren't all drawn on the
       Mainscreen SVG — see the design system text for both states. Red reuses ZONE_RED /
       `—rr-err`, already established as the system's one dual-purpose "attention" red
       (HF zone 5 on-device, log-level badges on the web dashboard). -->
  <circle cx="240" cy="418" r="28" fill="#1E252B" stroke="#CBA36B" stroke-width="2"/>
  <circle cx="240" cy="418" r="13" fill="none" stroke="#CBA36B" stroke-width="2"/>
  <circle cx="240" cy="418" r="7" fill="#C1604A"/>
</svg>

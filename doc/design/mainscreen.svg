<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Rim &amp; Ridge Mainscreen: zentrale Geschwindigkeit, Speed-Arc, Spur-Anzeige, Navigationshinweis, Fahrzeit/Uhrzeit, Statuszeile, Trittfrequenz, Watt, Temperatur, Höhe, Steigung, Herzfrequenz-Zonenband, Distanz, Modus-Chip, Fahrzustand-Icon, Straßenqualität-Indikator, Pause- und Einstellungen-Tasten">
  <title>Rim &amp; Ridge — Mainscreen</title>

  <circle cx="240" cy="240" r="240" fill="#161B1F"/>
  <circle cx="240" cy="240" r="234" fill="none" stroke="#3A362E" stroke-width="1.5"/>

  <!-- speed arc: track (full 270°) + progress fill, gap fixed at bottom -->
  <circle cx="240" cy="240" r="222" fill="none" stroke="#332F28" stroke-width="16" stroke-linecap="round" stroke-dasharray="1046.15 348.72" transform="rotate(135 240 240)"/>
  <circle cx="240" cy="240" r="222" fill="none" stroke="#CBA36B" stroke-width="16" stroke-linecap="round" stroke-dasharray="495.05 899.82" transform="rotate(135 240 240)"/>
  <line x1="111.4" y1="71.4" x2="99.3" y2="55.5" stroke="#F3ECDF" stroke-width="4" stroke-linecap="round"/>

  <!-- status row: wifi / gps / battery -->
  <g transform="translate(188,60)" fill="none" stroke="#CBA36B" stroke-width="2.1" stroke-linecap="round">
    <circle cx="0" cy="6" r="1.6" fill="#CBA36B" stroke="none"/>
    <path d="M -5,1 A 7 7 0 0 1 5,1"/>
    <path d="M -9,-4 A 13 13 0 0 1 9,-4"/>
  </g>
  <g transform="translate(240,58)">
    <path d="M0,-9 C4.4,-9 7.5,-5.7 7.5,-1.6 C7.5,4 0,11 0,11 C0,11 -7.5,4 -7.5,-1.6 C-7.5,-5.7 -4.4,-9 0,-9 Z" fill="none" stroke="#CBA36B" stroke-width="2"/>
    <circle cx="0" cy="-1.6" r="2.3" fill="#CBA36B"/>
  </g>
  <g transform="translate(292,60)">
    <rect x="-9" y="-5.5" width="16" height="11" rx="1.5" fill="none" stroke="#CBA36B" stroke-width="1.8"/>
    <rect x="7.3" y="-2.5" width="2.2" height="5" rx="0.6" fill="#CBA36B"/>
    <rect x="-7" y="-3.5" width="8.8" height="7" rx="0.6" fill="#7FA08F"/>
  </g>

  <!-- lane hint (conditional: only when OsmAnd reports lane data), otherwise absent and nav chip stays centered -->
  <g id="laneGroup">
    <rect x="102" y="92" width="86" height="40" rx="9" fill="#1E252B" stroke="#CBA36B" stroke-opacity="0.3" stroke-width="1.4"/>
    <g transform="translate(116,112) scale(0.75)" fill="none" stroke="#CBA36B" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4,10 L4,-2 L-6,-2"/>
      <path d="M-6,-2 L-1,-7 M-6,-2 L-1,3"/>
    </g>
    <g transform="translate(145,112) scale(0.75)" fill="none" stroke="#CBA36B" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0,10 L0,-8"/>
      <path d="M-4,-3 L0,-8 L4,-3"/>
    </g>
    <g transform="translate(174,112) scale(0.75)" fill="none" stroke="#CBA36B" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0,10 L0,-2"/>
      <path d="M0,-2 L0,-9"/>
      <path d="M-3.5,-4.5 L0,-9 L3.5,-4.5"/>
    </g>
    <g transform="translate(174,112) scale(0.75)" fill="none" stroke="#CBA36B" stroke-opacity="0.4" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0,-2 L8,-9"/>
      <path d="M8,-9 L3.5,-7.5 M8,-9 L6.5,-4"/>
    </g>
  </g>

  <!-- nav chip: shifts right (translateX 46) when laneGroup is present -->
  <g id="navChipGroup" transform="translate(46,0)">
    <rect x="150" y="92" width="170" height="40" rx="20" fill="#1E252B" stroke="#CBA36B" stroke-opacity="0.35" stroke-width="1.5"/>
    <g transform="translate(178,112)" fill="none" stroke="#CBA36B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0,12 L0,-4 L-9,-4"/>
      <path d="M-9,-4 L-4,-8 M-9,-4 L-4,0"/>
    </g>
    <text x="203" y="120" font-family="'IBM Plex Mono',monospace" font-size="21" fill="#E7E2D6">180 m</text>
  </g>

  <!-- ride time / clock: one shared slot, icon+value both swap together depending on mode
       (elapsed ride time with the stopwatch icon, or time-of-day with the clock-face icon;
       that switch is app logic, not covered here). Sits in the gap between the nav row and
       the hero speed number; icon fixed at x=210 so the value can grow (ride time) or shrink
       (clock) without re-centering the pair. -->
  <g id="timeGroup">
    <g transform="translate(210,157)" fill="none" stroke="#CBA36B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-1.6" y="-9.6" width="3.2" height="2.6" rx="1" fill="#CBA36B" stroke="none"/>
      <circle cx="0" cy="1" r="7" fill="none"/>
      <line x1="0" y1="1" x2="0" y2="-4"/>
      <line x1="0" y1="1" x2="3.6" y2="-2.2" stroke-width="1.3"/>
      <circle cx="0" cy="1" r="0.9" fill="#CBA36B" stroke="none"/>
    </g>
    <text x="224" y="163" font-family="'Big Shoulders Display'" font-weight="600" font-size="28" fill="#E7E2D6">1:24:07</text>
  </g>

  <!-- cadence / watts -->
  <g transform="translate(80,193)" fill="none" stroke="#CBA36B" stroke-width="2" stroke-linecap="round">
    <path d="M -6,2 A 7 7 0 1 1 3,7.5"/>
    <path d="M3,7.5 L7,7 L4,3" fill="#CBA36B" stroke="none"/>
  </g>
  <text x="80" y="223" text-anchor="middle" font-family="'Big Shoulders Display'" font-weight="600" font-size="26" fill="#E7E2D6">82</text>
  <text x="80" y="239" text-anchor="middle" font-family="'IBM Plex Mono'" font-size="13" fill="#9BA097">rpm</text>

  <g transform="translate(400,190)"><polygon points="2,-9 -4,1 0,1 -2,9 5,-1 1,-1" fill="#CBA36B"/></g>
  <text x="400" y="223" text-anchor="middle" font-family="'Big Shoulders Display'" font-weight="600" font-size="26" fill="#E7E2D6">186</text>
  <text x="400" y="239" text-anchor="middle" font-family="'IBM Plex Mono'" font-size="13" fill="#9BA097">W</text>

  <!-- speed: the hero value -->
  <text x="240" y="272" text-anchor="middle" font-family="'Big Shoulders Display'" font-weight="700" font-size="130" fill="#F3ECDF">28.4</text>
  <text x="240" y="301" text-anchor="middle" font-family="'IBM Plex Mono'" font-size="18" letter-spacing="2" fill="#9BA097">KM/H</text>

  <!-- temperature / altitude / gradient -->
  <g transform="translate(88,325)" fill="none" stroke="#CBA36B" stroke-width="1.8">
    <rect x="-3" y="-9" width="6" height="13" rx="3"/>
    <circle cx="0" cy="7" r="4.5" fill="#CBA36B" stroke="none"/>
  </g>
  <text x="104" y="334" font-family="'Big Shoulders Display'" font-weight="600" font-size="22" fill="#E7E2D6">14°</text>

  <g transform="translate(208,325)">
    <polyline points="-9,7 -2,-6 3,0 9,-8" fill="none" stroke="#7FA08F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="224" y="334" font-family="'Big Shoulders Display'" font-weight="600" font-size="22" fill="#E7E2D6">612m</text>

  <g transform="translate(328,325)" stroke="#CBA36B" stroke-width="2.2" stroke-linecap="round">
    <line x1="-8" y1="8" x2="8" y2="-8"/>
    <path d="M2,-8 L8,-8 L8,-2" fill="none"/>
  </g>
  <text x="344" y="334" font-family="'Big Shoulders Display'" font-weight="600" font-size="22" fill="#E7E2D6">+4.2%</text>

  <!-- heart rate: value + five-zone band + position marker -->
  <g transform="translate(218,353)">
    <path d="M0,4 C-6,-2 -10,-8 -4,-11 C-1,-12.5 0,-9.5 0,-8 C0,-9.5 1,-12.5 4,-11 C10,-8 6,-2 0,4 Z" fill="#CBA36B"/>
  </g>
  <text x="232" y="359" font-family="'Big Shoulders Display'" font-weight="600" font-size="20" fill="#E7E2D6">142</text>
  <rect x="110" y="366" width="52" height="14" rx="7" fill="#6C90B0"/>
  <rect x="162" y="366" width="52" height="14" fill="#6FA98C"/>
  <rect x="214" y="366" width="52" height="14" fill="#D7B463"/>
  <rect x="266" y="366" width="52" height="14" fill="#CE8A4C"/>
  <rect x="318" y="366" width="52" height="14" rx="7" fill="#C1604A"/>
  <polygon points="274,357 268,364 280,364" fill="#F3ECDF"/>

  <!-- bottom row: pause + [distance / mode chip / ride-state icon / quality bars, stacked] + settings.
       Coordinates below are the real, shipped `rim_ridge` screen (read from screens.c / the
       .eez-project directly, 2026-09-25) — this replaces an earlier, stale version of this
       section that had the icon and distance side by side at y≈402-407. The odometer value
       grows wider than a single digit group over a device's lifetime ("2138.6 km" and up), which
       no longer fit next to the icon at a fixed x — the live screen resolved that by stacking
       distance / mode chip / ride-state icon vertically in one column instead, flanked by the
       two round buttons. -->
  <circle cx="148" cy="408" r="25" fill="#1E252B" stroke="#CBA36B" stroke-width="2"/>
  <rect x="143" y="398" width="5" height="20" fill="#CBA36B"/>
  <rect x="153" y="398" width="5" height="20" fill="#CBA36B"/>

  <circle cx="332" cy="408" r="25" fill="#1E252B" stroke="#CBA36B" stroke-width="2"/>
  <circle cx="332" cy="408" r="9" fill="none" stroke="#CBA36B" stroke-width="2.2"/>
  <circle cx="332" cy="408" r="2" fill="#CBA36B"/>
  <g stroke="#CBA36B" stroke-width="2.2" stroke-linecap="round">
    <line x1="332" y1="396" x2="332" y2="390" transform="rotate(0 332 408)"/>
    <line x1="332" y1="396" x2="332" y2="390" transform="rotate(60 332 408)"/>
    <line x1="332" y1="396" x2="332" y2="390" transform="rotate(120 332 408)"/>
    <line x1="332" y1="396" x2="332" y2="390" transform="rotate(180 332 408)"/>
    <line x1="332" y1="396" x2="332" y2="390" transform="rotate(240 332 408)"/>
    <line x1="332" y1="396" x2="332" y2="390" transform="rotate(300 332 408)"/>
  </g>

  <!-- distance: real widget is lv_font_montserrat_26, right-aligned in a 173-307 box (a known,
       still-open deviation from the Big Shoulders Display 20px this doc originally specced —
       kept as shipped here rather than silently "fixed" back, see §6 for the tradeoff). -->
  <text x="307" y="410" text-anchor="end" font-family="'Big Shoulders Display'" font-weight="700" font-size="26" fill="#E7E2D6">2138.6 km</text>

  <rect x="214" y="413" width="52" height="16" rx="8" fill="#282019"/>
  <text x="240" y="424.5" text-anchor="middle" font-family="'IBM Plex Mono'" font-size="10" letter-spacing="0.5" fill="#CBA36B">TOUR 1</text>

  <g id="rideStateIcon" transform="translate(241,447) scale(1.394)" fill="none" stroke="#CBA36B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-5.5" cy="3" r="3.2"/>
    <circle cx="5.5" cy="3" r="3.2"/>
    <path d="M-5.5,3 L-0.8,3"/>
    <path d="M-0.8,3 L-3,-4.3"/>
    <path d="M-0.8,3 L3.8,-4.8"/>
    <path d="M3.8,-4.8 L5.5,3"/>
    <path d="M-3,-4.3 L3.8,-4.8"/>
    <path d="M-4.2,-4.6 L-1.8,-4"/>
    <path d="M2.8,-5.6 L4.8,-4.2"/>
  </g>

  <!-- road-quality indicator: rr_line_rq, a single thin line just above the
       screen edge (real widget: align=BOTTOM_MID, offset (2,-16), 115x5,
       line_width=5 — shown here at its real shipped geometry, not the
       original 5-squares sketch, which was superseded before being built).
       Color is the current class's HF-zone-band token (§1), shown here as
       class 2/"good" (ZONE_GREEN); class 0 hides the line entirely instead
       of showing a neutral color. -->
  <line x1="184.5" y1="461.5" x2="299.5" y2="461.5" stroke="#6FA98C" stroke-width="5"/>
</svg>

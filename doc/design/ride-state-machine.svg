<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="820" viewBox="0 0 1080 820" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowBrass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#CBA36B"/>
    </marker>
    <marker id="arrowSage" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA08F"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C1604A"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9BA097"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="820" fill="#161B1F"/>

  <text x="30" y="42" fill="#F3ECDF" font-size="26" font-weight="600">Ride-Zustandsautomat (RimRidge)</text>
  <text x="30" y="66" fill="#9BA097" font-size="14">EDrivingState in src/Stats/Statistics.h -- Achse 1: Ride-Modus (manuell, Pause/Start-Taste) · Achse 2: Bewegung (automatisch, Geschwindigkeit)</text>

  <!-- ================= Ride-mode group box (Ride, rideMode=true) ================= -->
  <rect x="560" y="110" width="450" height="300" rx="14" fill="none" stroke="#CBA36B" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="580" y="136" fill="#CBA36B" font-size="15" font-weight="600">Ride  (rideMode = true)</text>
  <text x="580" y="156" fill="#9BA097" font-size="12">Coast ist Sub-Zustand von Ride (Trittfrequenz/Wattzahl-Hysterese)</text>

  <!-- DRIVE_POWER node -->
  <rect x="600" y="180" width="190" height="90" rx="10" fill="#1E252B" stroke="#CBA36B" stroke-width="2"/>
  <text x="695" y="214" fill="#F3ECDF" font-size="16" font-weight="600" text-anchor="middle">DS_DRIVE_POWER</text>
  <text x="695" y="234" fill="#E7E2D6" font-size="12" text-anchor="middle">"Ride" -- sportliches Icon</text>
  <text x="695" y="251" fill="#9BA097" font-size="11" text-anchor="middle">Pause-Knopf zeigt Pause-Symbol</text>

  <!-- DRIVE_COASTING node -->
  <rect x="600" y="300" width="190" height="90" rx="10" fill="#1E252B" stroke="#7FA08F" stroke-width="2"/>
  <text x="695" y="334" fill="#F3ECDF" font-size="16" font-weight="600" text-anchor="middle">DS_DRIVE_COASTING</text>
  <text x="695" y="354" fill="#E7E2D6" font-size="12" text-anchor="middle">"Coast" -- Sub-Zustand von Ride</text>
  <text x="695" y="371" fill="#9BA097" font-size="11" text-anchor="middle">nur wenn Cadence/Power-Sensor da</text>

  <!-- Power <-> Coasting hysteresis edges -->
  <path d="M660,270 C640,283 640,297 660,300" fill="none" stroke="#7FA08F" stroke-width="1.7" marker-end="url(#arrowSage)"/>
  <text x="600" y="290" fill="#7FA08F" font-size="11" text-anchor="end">Cadence &lt; 40 rpm</text>
  <path d="M730,300 C750,287 750,273 730,270" fill="none" stroke="#CBA36B" stroke-width="1.7" marker-end="url(#arrowBrass)"/>
  <text x="795" y="290" fill="#CBA36B" font-size="11">Cadence &gt; 50 rpm</text>

  <!-- ================= FreeRide / Cruise node ================= -->
  <rect x="60" y="200" width="270" height="150" rx="14" fill="#1E252B" stroke="#CBA36B" stroke-width="2.5"/>
  <text x="195" y="236" fill="#F3ECDF" font-size="17" font-weight="600" text-anchor="middle">DS_FREE_RIDE</text>
  <text x="195" y="256" fill="#E7E2D6" font-size="12" text-anchor="middle">rideMode = false</text>
  <text x="195" y="278" fill="#9BA097" font-size="11.5" text-anchor="middle">Anzeige/Icon identisch, ob "FreeRide"</text>
  <text x="195" y="293" fill="#9BA097" font-size="11.5" text-anchor="middle">oder "Cruise" -- einziger Unterschied:</text>
  <text x="195" y="308" fill="#9BA097" font-size="11.5" text-anchor="middle">rideSessionOpen (Start/Ride-Statistik</text>
  <text x="195" y="323" fill="#9BA097" font-size="11.5" text-anchor="middle">läuft nur bei offener Session weiter)</text>
  <text x="195" y="341" fill="#9BA097" font-size="11" text-anchor="middle" font-style="italic">Pause-Knopf zeigt Start-Pfeil</text>

  <!-- FreeRide <-> Ride manual edges -->
  <path d="M330,255 L600,205" fill="none" stroke="#000" stroke-width="0" />
  <path d="M330,240 C440,215 500,205 596,205" fill="none" stroke="#CBA36B" stroke-width="2" marker-end="url(#arrowBrass)"/>
  <text x="460" y="200" fill="#CBA36B" font-size="12" text-anchor="middle">Start-Pfeil tippen (kurz) -&gt; Ride</text>
  <text x="460" y="215" fill="#9BA097" font-size="10.5" text-anchor="middle">1. Mal: neue Session (Start/Ride = 0) · sonst: Resume</text>

  <path d="M596,340 C500,375 420,375 330,315" fill="none" stroke="#9BA097" stroke-width="2" marker-end="url(#arrowMuted)"/>
  <text x="460" y="392" fill="#9BA097" font-size="12" text-anchor="middle">Pause tippen (kurz) -&gt; Cruise</text>
  <text x="460" y="406" fill="#9BA097" font-size="10.5" text-anchor="middle">Session bleibt offen (Ride wird NICHT beendet)</text>

  <!-- Long-press stop edge, spans from Ride group down to FreeRide, distinct color -->
  <path d="M760,410 C760,480 330,470 250,352" fill="none" stroke="#C1604A" stroke-width="2.2" stroke-dasharray="1 0" marker-end="url(#arrowRed)"/>
  <text x="560" y="468" fill="#C1604A" font-size="12.5" text-anchor="middle" font-weight="600">Pause lang gedrückt -&gt; Stop</text>
  <text x="560" y="484" fill="#9BA097" font-size="10.5" text-anchor="middle">rideSessionOpen = false: Start/Ride-Werte enden (Trip/Tour laufen unabhängig weiter)</text>

  <!-- ================= Stop / Break row (available from ANY moving state) ================= -->
  <rect x="30" y="560" width="1000" height="180" rx="14" fill="none" stroke="#9BA097" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="50" y="584" fill="#9BA097" font-size="13" font-weight="600">Unterzustand in ALLEN Modi (rideMode egal) -- rein automatisch, aus Geschwindigkeit</text>

  <rect x="90" y="610" width="220" height="100" rx="10" fill="#1E252B" stroke="#D7B463" stroke-width="2"/>
  <text x="200" y="648" fill="#F3ECDF" font-size="16" font-weight="600" text-anchor="middle">DS_STOP</text>
  <text x="200" y="668" fill="#E7E2D6" font-size="12" text-anchor="middle">kurzer Halt (Ampel etc.)</text>
  <text x="200" y="686" fill="#9BA097" font-size="11" text-anchor="middle">v &lt; 0.3 km/h</text>

  <rect x="420" y="610" width="220" height="100" rx="10" fill="#1E252B" stroke="#CE8A4C" stroke-width="2"/>
  <text x="530" y="648" fill="#F3ECDF" font-size="16" font-weight="600" text-anchor="middle">DS_BREAK</text>
  <text x="530" y="668" fill="#E7E2D6" font-size="12" text-anchor="middle">längere Pause</text>
  <text x="530" y="686" fill="#9BA097" font-size="11" text-anchor="middle">Stop &gt; 2 min am Stück</text>

  <path d="M310,650 L420,650" fill="none" stroke="#D7B463" stroke-width="2" marker-end="url(#arrowBrass)"/>
  <text x="365" y="638" fill="#D7B463" font-size="11" text-anchor="middle">automatisch</text>

  <!-- Stop/break resume note -->
  <rect x="700" y="610" width="300" height="100" rx="10" fill="none" stroke="#9BA097" stroke-width="1"/>
  <text x="850" y="636" fill="#E7E2D6" font-size="12.5" text-anchor="middle" font-weight="600">Weiterfahren (v &gt; 5.5 km/h)</text>
  <text x="850" y="658" fill="#9BA097" font-size="11" text-anchor="middle">rideMode==true  -&gt; zurück zu Ride</text>
  <text x="850" y="676" fill="#9BA097" font-size="11" text-anchor="middle">(Power/Coasting nach Cadence)</text>
  <text x="850" y="694" fill="#9BA097" font-size="11" text-anchor="middle">rideMode==false -&gt; zurück zu FreeRide/Cruise</text>

  <path d="M640,650 L700,650" fill="none" stroke="#9BA097" stroke-width="2" marker-end="url(#arrowMuted)"/>

  <!-- Edges from FreeRide and Ride down into Stop -->
  <path d="M195,350 L195,610" fill="none" stroke="#D7B463" stroke-width="1.6" marker-end="url(#arrowBrass)"/>
  <path d="M660,410 C500,500 300,520 210,610" fill="none" stroke="#D7B463" stroke-width="1.6" marker-end="url(#arrowBrass)"/>
  <text x="205" y="480" fill="#D7B463" font-size="10.5">v &lt; 0.3 km/h (aus jedem bewegten Zustand)</text>

  <!-- ================= NO_CONN corner node ================= -->
  <rect x="880" y="18" width="180" height="86" rx="10" fill="#1E252B" stroke="#6C90B0" stroke-width="2"/>
  <text x="970" y="50" fill="#F3ECDF" font-size="14" font-weight="600" text-anchor="middle">DS_NO_CONN</text>
  <text x="970" y="68" fill="#9BA097" font-size="10.5" text-anchor="middle">Speedsensor getrennt</text>
  <text x="970" y="83" fill="#9BA097" font-size="10.5" text-anchor="middle">(rideMode bleibt erhalten)</text>

  <path d="M880,60 C820,60 760,60 720,150" fill="none" stroke="#6C90B0" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowMuted)"/>
  <text x="790" y="94" fill="#6C90B0" font-size="10">Sensor verbunden -&gt; letzter Zustand</text>

  <!-- ================= Legend ================= -->
  <g transform="translate(30,760)">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#CBA36B" stroke-width="2" marker-end="url(#arrowBrass)"/>
    <text x="42" y="4" fill="#E7E2D6" font-size="12">manueller Tap (kurz)</text>

    <line x1="230" y1="0" x2="264" y2="0" stroke="#C1604A" stroke-width="2.2" marker-end="url(#arrowRed)"/>
    <text x="272" y="4" fill="#E7E2D6" font-size="12">manueller Long-Press (Stop)</text>

    <line x1="530" y1="0" x2="564" y2="0" stroke="#D7B463" stroke-width="1.8" marker-end="url(#arrowBrass)"/>
    <text x="572" y="4" fill="#E7E2D6" font-size="12">automatisch (Geschwindigkeit/Zeit)</text>

    <line x1="830" y1="0" x2="864" y2="0" stroke="#6C90B0" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowMuted)"/>
    <text x="872" y="4" fill="#E7E2D6" font-size="12">Sensor-Verbindung</text>
  </g>
</svg>

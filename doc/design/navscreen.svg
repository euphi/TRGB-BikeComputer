<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Rim &amp; Ridge Navigationsscreen: Spur-Anzeige, großes Abbiege-Icon mit Entfernung, Straßenname, Distanz-Ring, übernächster Hinweis, Geschwindigkeit, Steigung, Herzfrequenz">
  <title>Rim &amp; Ridge — Navigationsscreen</title>

  <circle cx="240" cy="240" r="240" fill="#161B1F"/>
  <circle cx="240" cy="240" r="234" fill="none" stroke="#3A362E" stroke-width="1.5"/>

  <!-- distance-to-maneuver ring: same gapped-arc mechanic as the speed arc, fed a different value.
       0% = bottom-left edge of the gap, 100% = bottom-right edge, filling clockwise over the top as you approach. -->
  <circle cx="240" cy="240" r="222" fill="none" stroke="#332F28" stroke-width="16" stroke-linecap="round" stroke-dasharray="1046.15 348.72" transform="rotate(135 240 240)"/>
  <circle cx="240" cy="240" r="222" fill="none" stroke="#CBA36B" stroke-width="16" stroke-linecap="round" stroke-dasharray="575.38 819.49" transform="rotate(135 240 240)"/>

  <!-- lane row: single shared frame, one arrow per real lane, conditional on lane data being available -->
  <rect x="180" y="45" width="120" height="42" rx="9" fill="#1E252B" stroke="#CBA36B" stroke-opacity="0.3" stroke-width="1.5"/>
  <g transform="translate(200,66) scale(1.2)" fill="none" stroke="#CBA36B" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4,10 L4,-2 L-6,-2"/>
    <path d="M-6,-2 L-1,-7 M-6,-2 L-1,3"/>
  </g>
  <g transform="translate(240,66) scale(1.2)" fill="none" stroke="#CBA36B" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0,10 L0,-8"/>
    <path d="M-4,-3 L0,-8 L4,-3"/>
  </g>
  <g transform="translate(280,66) scale(1.2)" fill="none" stroke="#CBA36B" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0,10 L0,-2"/>
    <path d="M0,-2 L0,-9"/>
    <path d="M-3.5,-4.5 L0,-9 L3.5,-4.5"/>
  </g>
  <g transform="translate(280,66) scale(1.2)" fill="none" stroke="#CBA36B" stroke-opacity="0.4" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0,-2 L8,-9"/>
    <path d="M8,-9 L3.5,-7.5 M8,-9 L6.5,-4"/>
  </g>

  <!-- primary maneuver: icon, big distance, street name -->
  <g transform="translate(250,130)" fill="none" stroke="#CBA36B" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0,55 L0,-15 L-38,-15"/>
    <path d="M-38,-15 L-15,-32 M-38,-15 L-15,2"/>
  </g>
  <text x="240" y="264" text-anchor="middle" font-family="'Big Shoulders Display'" font-weight="700" fill="#F3ECDF"><tspan font-size="84">180</tspan><tspan font-size="34" dx="6">m</tspan></text>
  <text x="240" y="298" text-anchor="middle" font-family="'IBM Plex Sans'" font-weight="600" font-size="27" fill="#A39D8E">Feldweg</text>

  <!-- next-next maneuver: small badge, deliberately off the main reading line -->
  <g transform="translate(365,118) scale(0.42)" fill="none" stroke="#CBA36B" stroke-opacity="0.55" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0,55 L0,-15 L-38,-15"/>
    <path d="M-38,-15 L-15,-32 M-38,-15 L-15,2"/>
  </g>
  <text x="365" y="156" text-anchor="middle" font-family="'Big Shoulders Display'" font-weight="600" font-size="24" fill="#A39D8E">60 m</text>

  <!-- speed + gradient -->
  <text x="195" y="358" text-anchor="middle" font-family="'Big Shoulders Display'" font-weight="700" font-size="48" fill="#E7E2D6">28.4</text>
  <text x="195" y="376" text-anchor="middle" font-family="'IBM Plex Mono'" font-size="15" letter-spacing="1.5" fill="#9BA097">KM/H</text>

  <g transform="translate(288,338)" stroke="#CBA36B" stroke-width="2.6" stroke-linecap="round">
    <line x1="-8" y1="8" x2="8" y2="-8"/>
    <path d="M2,-8 L8,-8 L8,-2" fill="none"/>
  </g>
  <text x="302" y="356" font-family="'Big Shoulders Display'" font-weight="600" font-size="28" fill="#E7E2D6">+4.2%</text>

  <!-- heart rate: colour + number only, no band, on this screen it is secondary -->
  <g transform="translate(220,408)">
    <path d="M0,4 C-6,-2 -10,-8 -4,-11 C-1,-12.5 0,-9.5 0,-8 C0,-9.5 1,-12.5 4,-11 C10,-8 6,-2 0,4 Z" fill="#CBA36B"/>
  </g>
  <text x="234" y="415" font-family="'Big Shoulders Display'" font-weight="600" font-size="24" fill="#E7E2D6">142</text>
</svg>

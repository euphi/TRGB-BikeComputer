<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug Log</title>
  <link rel="stylesheet" href="/stylesheet.css">
</head>
<body>

<div class="container" style="max-width:640px;">
  <h1 style="font-size:1.4rem;">Debug Log</h1>
  <div class="console" id="logContainer">
    <div id="logOutput"></div>
  </div>
</div>

<script>
  // Wraps a leading DEBUG/INFO/WARN/ERROR token in the matching colored badge,
  // if the log line happens to start with one -- purely cosmetic, falls back
  // to plain text for anything else.
  function formatLine(text) {
    var m = text.match(/^\s*(DEBUG|INFO|WARN|ERROR)\b(.*)$/);
    if (!m) return text;
    var cls = { DEBUG: 'badge-debug', INFO: 'badge-info', WARN: 'badge-warn', ERROR: 'badge-error' }[m[1]];
    return '<span class="badge ' + cls + '">' + m[1] + '</span>' + m[2];
  }

  // Create an EventSource object for the 'debug/log' endpoint
  var eventSource = new EventSource('/debug/logevent');

  // Function to handle incoming log messages
  eventSource.onmessage = function(event) {
    var line = document.createElement('div');
    line.className = 'line';
    line.innerHTML = formatLine(event.data);
    var out = document.getElementById('logOutput');
    out.insertBefore(line, out.firstChild);
  };

  // Function to handle errors
  eventSource.onerror = function(error) {
    console.error('EventSource failed:', error);
    // Attempt to reconnect after a short delay
    setTimeout(function() {
      eventSource.close();
      eventSource = new EventSource('/debug/logevent');
    }, 3000);
  };
</script>

<div class="container" style="margin-top:14px;"><div class="row" style="margin-top:18px;"><a class="btn btn-ghost" href="/" onclick="if(history.length>1){history.back();return false;}">Back</a></div>
</div>
</body>
</html>

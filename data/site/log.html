<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/stylesheet.css">
  <title>Set Log Levels</title>

  <script>
    function badgeClass(level) {
      switch ((level || '').toUpperCase()) {
        case 'DEBUG': return 'badge-debug';
        case 'INFO':  return 'badge-info';
        case 'WARN':  return 'badge-warn';
        case 'ERROR': return 'badge-error';
        default:      return '';
      }
    }
    function levelBadge(level) {
      return '<span class="badge ' + badgeClass(level) + '">' + level + '</span>';
    }

    function setLogLevels() {
      // Get values from the input fields
      var tag = document.getElementById("tagSelect").value;
      var level = document.getElementById("levelSelect").value;
      var output = document.getElementById("outputSelect").value;

      // Make a GET request to set log levels
      var xhr = new XMLHttpRequest();
      xhr.onreadystatechange = function() {
        if (xhr.readyState === XMLHttpRequest.DONE) {
          if (xhr.status === 200) {
            // Display success message
            getLogLevels();
            alert(xhr.responseText);
          } else {
            // Display error message
            getLogLevels();
            alert('Error: ' + xhr.status);
          }
        }
      };

      // Replace 'your-device-ip' with the actual IP address of your device
      xhr.open('GET', '/log/set?tag=' + tag + '&level=' + level + '&output=' + output, true);

      xhr.send();
    }
    function getLogLevels() {
        // Make a GET request to retrieve current log levels
        var xhr = new XMLHttpRequest();
        xhr.onreadystatechange = function() {
          if (xhr.readyState === XMLHttpRequest.DONE) {
            if (xhr.status === 200) {
              // Parse the JSON response
              var logLevels = JSON.parse(xhr.responseText);
              // Update the log levels table
              updateLogLevelsTable(logLevels);
            } else {
              // Display error message
              alert('Error: ' + xhr.status);
            }
          }
        };

        // Replace 'your-device-ip' with the actual IP address of your device
        xhr.open('GET', '/log/get', true);
        xhr.send();
      }

      function updateLogLevelsTable(logLevels) {
        // Get the table body element
        var tableBody = document.getElementById("logLevelsTableBody");
        // Clear existing rows
        tableBody.innerHTML = "";

        // Iterate through logLevels and add rows to the table -- Serial and File can differ,
        // so /log/get reports both per tag now.
        for (var tag in logLevels) {
          var row = tableBody.insertRow();
          var cellTag = row.insertCell(0);
          var cellFile = row.insertCell(1);
          var cellSerial = row.insertCell(2);
          cellTag.innerHTML = tag;
          cellFile.innerHTML = levelBadge(logLevels[tag].file);
          cellSerial.innerHTML = levelBadge(logLevels[tag].serial);
        }
      }

      function goBack() {
        // Go back to the previous page in the browser's history
        window.history.back();
      }

      // Initial call to get current log levels when the page loads
      getLogLevels();

  </script>
</head>
<body>
  <div class="container" style="max-width:560px;">
   <!-- Table to display current log levels -->
  <h2>Current Log Levels</h2>
  <table border="1">
    <thead>
      <tr>
        <th>Tag</th>
        <th>File</th>
        <th>Serial</th>
      </tr>
    </thead>
    <tbody id="logLevelsTableBody"></tbody>
  </table>
  <h2 style="margin-top:22px;">Set Log Levels</h2>
  <label for="tagSelect">Tag:</label>
  <select id="tagSelect">
    <option value="RAW">RAW</option>
    <option value="FL">FL</option>
    <option value="BLE">BLE</option>
    <option value="STAT">STAT</option>
    <option value="WIFI">WIFI</option>
    <option value="SD">SD</option>
    <option value="OP">OP</option>
    <option value="CLI">CLI</option>
    <option value="UI">UI</option>
    <option value="WEB">WEB</option>
  </select>
  <label for="levelSelect">Level:</label>
  <select id="levelSelect">
    <option value="DEBUG">DEBUG</option>
    <option value="INFO">INFO</option>
    <option value="WARN">WARN</option>
    <option value="ERROR">ERROR</option>
  </select>
  <label for="outputSelect">Output:</label>
  <select id="outputSelect">
    <option value="File">File</option>
    <option value="Serial">Serial</option>
  </select>
  <div class="row" style="margin-top:14px;">
    <a class="btn" onclick="setLogLevels()">Set Log Levels</a>
    <a class="btn btn-ghost" onclick="goBack()">Back</a>
    <a class="btn btn-ghost" href="/cleanup">Cleanup logfiles</a>
  </div>
  <p style="font-size:0.78rem; color:var(--rr-muted); margin-top:10px;">Cleanup deletes empty and very small logfiles.</p>
  </div>
</body>
</html>

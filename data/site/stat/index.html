<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Series Viewer</title>
<script src="/js/uPlot.iife.min.js"></script>
<link rel="stylesheet" href="/css/uPlot.min.css">
<link rel="stylesheet" href="/stylesheet.css">
</head>
<body>
	<div class="chart-panel">
		<h1>Time Series Chart</h1>
		<p class="chart-caption">/stat/data &middot; refreshes every 5s</p>
		<div id="chart"></div>
	</div>

	<script>
		// Create uPlot chart, themed to match the Rim & Ridge panel it sits in
		var opts = {
			title : '',
			width : 800,
			height : 520,
			series : [ {}, {
				show : true,
				stroke : "#CBA36B",
				width : 2,
			} ],
			axes : [
				{ stroke : "#9BA097", grid : { stroke : "#3A362E", width : 1 }, ticks : { stroke : "#3A362E" } },
				{ stroke : "#9BA097", grid : { stroke : "#3A362E", width : 1 }, ticks : { stroke : "#3A362E" } },
			],
		};
		var data = [ [], [] ]
		var uplot = new uPlot(opts, data, document.getElementById('chart'));
		// Fetch data asynchronously and update the chart
		async function fetchData() {
			const response = await
			fetch('/stat/data');
			const newData = await
			response.json();
			uplot.setData(newData);
		}
		// Update the chart every 5 seconds (adjust as needed)
		setInterval(fetchData, 5000);
		fetchData();
	</script>
</body>
</html>

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
#default_envs = trgb-esp32-s3-FL
default_envs = trgb-esp32-s3

[env]
;[env:esp32]
;board = esp32-s3-devkitc-1
board = esp32s3box
build_flags =
	-DBOARD_HAS_PSRAM
	-DLV_CONF_PATH=${platformio.include_dir}/lv_conf.h
	; ASYNCWEBSERVER_REGEX deliberately NOT set: AsyncCallbackWebHandler::canHandle()
	; builds a std::regex per regex-route on EVERY request, from the internal heap.
	; The three former regex routes are prefix routes now (WifiWebserver.cpp).
	; async_tcp's stack is internal RAM. Measured after the change: 4116 byte used,
	; 6124 free of 10240 (STACK line in the 60s report / "mem" on the serial CLI).
	; That is ~1.5x the observed peak as headroom -- do not lower further without a
	; fresh watermark, and re-measure after touching a handler or enabling OTA, which
	; is the deepest path through this task.
	-DCONFIG_ASYNC_TCP_STACK_SIZE=10240
	-DDEBUG_APP
	-DCORE_DEBUG_LEVEL=1
	-DTRGB_SKIP_DEFAULT_LOGO  ; we always call trgb.setLogo() before trgb.init() - skip embedding TRGBArduinoSupport's own ~690KB default logo


; CORE_DEBUG_LEVEL=4 to see details about BLE connections

board_build.cpu = esp32s3
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_src_filter =
	+<*>

lib_deps =
    ;IanH/TRGBArduinoSupport   ; Support library for T-RGB. Does initilization etc.
	https://github.com/fablabnbg/TRGBArduinoSupport.git
	https://github.com/mmMicky/TouchLib.git
	ESPDateTime
	rlogiacco/Battery Sense
	spacehuhn/SimpleCLI
	https://github.com/me-no-dev/ESPAsyncWebServer.git		; git version needed to fix "undefined reference to `mbedtls_md5_starts`"
	;ESP32Async/ESPAsyncWebServer
	sparkfun/SparkFun BME280@^2.0.9			; BME280 Air pressure for height/gradient (pinned: unpinned name failed to resolve/install after the pioarduino switch)
	;LostInCompilation/PrettyOTA
	majenkolibraries/CircularBuffer		; for statistics
	https://github.com/hanyazou/BMI160-Arduino.git		; BMI160
	ArduinoJSON

;platform_packages =
;	framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#2.0.6

upload_port = /dev/ttyACM*

extra_scripts =
    pre:build_versioning.py
    pre:git-version.py
    pre:apply_patches.py
    post:archive_firmware.py

[env:trgb-esp32-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino

build_flags =
    ${env.build_flags}
	-DTRGB_ROUND
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DTRGBBC_SENSORS_I2C=1

[env:trgb-esp32-s3-FL]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino

build_flags =
    ${env.build_flags}
	-DTRGB_OVAL
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBC_FL_SUPPORT
	-DBC_HOSTNAME=\"TRGB-FL\"

; Upload over WiFi to the firmware's own OTA endpoint (POST /update, WifiWebserver::setupOta()),
; not ArduinoOTA -- espota does not work. The file name picks the partition: "littlefs.bin"
; goes to the filesystem, anything else to the app, so "-t uploadfs" works as well.
; Default target is the mDNS name; where .local doesn't resolve, give the IP:
;   pio run -e trgb-esp32-s3-ota -t upload --upload-port 192.168.x.y
; Separate environment = separate build directory, i.e. one extra full build.
[env:trgb-esp32-s3-ota]
extends = env:trgb-esp32-s3
upload_protocol = custom
upload_port = TRGB-BC.local
upload_command = curl --fail-with-body --connect-timeout 10 -# -F "update=@$SOURCE" http://$UPLOAD_PORT/update

[env:trgb-esp32-s3-FL-ota]
extends = env:trgb-esp32-s3-FL
upload_protocol = custom
upload_port = TRGB-FL.local
upload_command = curl --fail-with-body --connect-timeout 10 -# -F "update=@$SOURCE" http://$UPLOAD_PORT/update

; Four BLE connections instead of three (TrailBridge + heart rate + speed + cadence): NimBLE's
; default CONFIG_BT_NIMBLE_MAX_CONNECTIONS is 3, the cadence sensor of the 2026-10-04 test ride could
; not connect (doc/PITFALLS.md). custom_sdkconfig makes pioarduino rebuild the IDF libraries ("hybrid
; compile": the first build takes 10-20 minutes and downloads ESP-IDF, cmake and ninja).
; Builds and runs (2026-10-09), free internal RAM with TrailBridge alone is the same as in the normal
; build. STILL OPEN: that the 4th peer connects (the log line "Can't connect ... (N other peer(s)
; connected)" tells N) and what four connected peers cost in internal RAM.
; Hybrid compile replaces the libraries inside the shared framework package, and the next build of a
; normal environment deletes and re-downloads the framework. Never run both in one PlatformIO core
; directory at the same time; use a core directory of its own for this variant (doc/PITFALLS.md):
;   PLATFORMIO_CORE_DIR=~/.platformio-ble4 PLATFORMIO_BUILD_DIR=$PWD/.pio/build-ble4 pio run -e trgb-esp32-s3-ble4
[env:trgb-esp32-s3-ble4]
extends = env:trgb-esp32-s3
custom_sdkconfig = CONFIG_BT_NIMBLE_MAX_CONNECTIONS=4

[env:trgb-esp32-s3-ble4-ota]
extends = env:trgb-esp32-s3-ble4
upload_protocol = custom
upload_port = TRGB-BC.local
upload_command = curl --fail-with-body --connect-timeout 10 -# -F "update=@$SOURCE" http://$UPLOAD_PORT/update

; Simulator build: fake speed, cadence and heart rate for testing the statistics at home --
; serial "sim", web /debug/sim, GPX playback with "python3 -m bikelog sim" (doc/SIMULATOR.md).
; The ride statistics go to an NVS namespace of their own (NVS_STAT_PREFIX), the real odometer
; stays untouched. Not for riding: the normal builds contain none of this.
[env:trgb-esp32-s3-sim]
extends = env:trgb-esp32-s3
build_flags =
    ${env:trgb-esp32-s3.build_flags}
	-DBC_SIM

[env:trgb-esp32-s3-sim-ota]
extends = env:trgb-esp32-s3-sim
upload_protocol = custom
upload_port = TRGB-BC.local
upload_command = curl --fail-with-body --connect-timeout 10 -# -F "update=@$SOURCE" http://$UPLOAD_PORT/update

;[env:native]
;platform=native
;build_flags=-Iunity
;lib_deps=unity

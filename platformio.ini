; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
#default_envs = esp32-s3-idf
#default_envs = trgb-esp32-s3-FL
default_envs = trgb-esp32-s3

[env]
;[env:esp32]
;board = esp32-s3-devkitc-1
board = esp32s3box
build_flags =
	-DBOARD_HAS_PSRAM
	-DLV_CONF_PATH=${platformio.include_dir}/lv_conf.h
	-DASYNCWEBSERVER_REGEX
	-DDEBUG_APP
	-DCORE_DEBUG_LEVEL=1
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1
	-DTRGB_SKIP_DEFAULT_LOGO  ; we always call trgb.setLogo() before trgb.init() - skip embedding TRGBArduinoSupport's own ~690KB default logo


; CORE_DEBUG_LEVEL=4 to see details about BLE connections

board_build.cpu = esp32s3
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; RimRidge (EEZ Studio, src/ui_eez/) reuses the existing custom font
; "by7x128" (5by7.ttf), which SquareLine already embeds under the same C
; symbol name (ui_font_by7x128) in src/ui/font/ui_font_by7x128.c - keep the
; original as the single definition and drop EEZ's re-export of the same
; font data to avoid a "multiple definition" link error. Re-add an
; exclusion here for any other font this ever collides on if more EEZ
; screens are converted.
build_src_filter =
	+<*>
	-<ui_eez/ui_font_by7x128.c>

lib_deps =
    ;IanH/TRGBArduinoSupport   ; Support library for T-RGB. Does initilization etc.
	https://github.com/fablabnbg/TRGBArduinoSupport.git
	https://github.com/mmMicky/TouchLib.git
	ESPDateTime
	rlogiacco/Battery Sense
	spacehuhn/SimpleCLI
	https://github.com/me-no-dev/ESPAsyncWebServer.git		; git version needed to fix "undefined reference to `mbedtls_md5_starts`"
	;ESP32Async/ESPAsyncWebServer
	sparkfun/SparkFun BME280@^2.0.9			; BME280 Air pressure for height/gradient (pinned: unpinned name failed to resolve/install after the pioarduino switch)
	ElegantOTA@=3.1.1
	;LostInCompilation/PrettyOTA
	majenkolibraries/CircularBuffer		; for statistics
	https://github.com/hanyazou/BMI160-Arduino.git		; BMI160
	ArduinoJSON

;platform_packages =
;	framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#2.0.6

upload_port = /dev/ttyACM*

extra_scripts =
    pre:build_versioning.py
    pre:git-version.py
    pre:apply_patches.py

[env:trgb-esp32-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino

build_flags =
    ${env.build_flags}
	-DTRGB_ROUND
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DTRGBBC_SENSORS_I2C=1

[env:trgb-esp32-s3-FL]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino

build_flags =
    ${env.build_flags}
	-DTRGB_OVAL
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBC_FL_SUPPORT

[env:trgb-esp32-s3-no-usb]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino

build_flags =
    ${env.build_flags}
	-DTRGB_ROUND
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DTRGBBC_SENSORS_I2C

; own IDF configuration not necessary for now - it does NOT build in current version
[env:trgb-esp32-s3-idf]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino, espidf
build_flags =
    ${env.build_flags}
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -Werror=all


;[env:native]
;platform=native
;build_flags=-Iunity
;lib_deps=unity

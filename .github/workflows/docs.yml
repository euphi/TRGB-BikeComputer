name: Documentation site

on:
  push:
    branches: [main]
    paths: ['doc/**', 'mkdocs.yml', 'README.MD', '.github/workflows/docs.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'   # picks up changes of the TrailBridge protocol

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r doc/requirements.txt
      - run: doc/fetch_trailbridge.sh
      - run: mkdocs build --strict -d _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
